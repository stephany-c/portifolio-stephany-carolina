<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient for letters: white to purple -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle outer glow -->
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Purple glow for backdrop -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="512" height="512" fill="#0a0a0a"/>

  <!-- Subtle purple radial glow in center -->
  <ellipse cx="256" cy="256" rx="220" ry="220" fill="url(#bgGlow)"/>

  <!-- Thin accent circle ring (subtle) -->
  <circle cx="256" cy="256" r="215" stroke="#a855f7" stroke-width="1" stroke-opacity="0.15" fill="none"/>

  <!-- Letters "SC" with gradient and glow -->
  <!-- S letter -->
  <text
    x="108"
    y="330"
    font-family="'Inter', 'SF Pro Display', 'Segoe UI', Arial, sans-serif"
    font-size="230"
    font-weight="700"
    letter-spacing="-8"
    fill="url(#textGradient)"
    filter="url(#glow)"
  >SC</text>

  <!-- Thin underline accent bar -->
  <rect x="108" y="358" width="296" height="3" rx="1.5" fill="url(#textGradient)" opacity="0.6"/>
</svg>